name: Branch Protection Audit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Verify Sensitive File Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes to sensitive files
        run: |
          SENSITIVE=(
            ".claude/settings.json"
            "CLAUDE.md"
            "docs/trading-strategy.md"
            "config/roles.json"
            ".github/workflows/"
            "job-applicator/.env*"
          )

          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)

          for path in "${SENSITIVE[@]}"; do
            if echo "$CHANGED" | grep -q "^${path}"; then
              echo "::notice::Sensitive path modified: $path"
            fi
          done

          echo "Audit complete. Review any notices above."
