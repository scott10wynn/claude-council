name: Security Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 6am UTC

permissions:
  contents: read
  security-events: write

jobs:
  # ── 1. Secret / credential leak detection ─────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. JavaScript / npm dependency audit ──────────────────────────────────
  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: resume-builder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit for vulnerabilities
        run: npm audit --audit-level=high

  # ── 3. Python dependency audit ────────────────────────────────────────────
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-applicator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: job-applicator/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  # ── 4. Hardcoded credential / dangerous pattern check ─────────────────────
  pattern-check:
    name: Hardcoded Credential Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for dangerous patterns
        run: |
          set +e
          FAIL=0

          # Placeholder strings that are intentionally fake — skip these
          PLACEHOLDER_PATTERN='your[-_]|yourpassword|your-key|CHANGE.ME|example|placeholder|xxxx|XXXX|<[A-Z_]+>|sk-ant-your'

          declare -A PATTERNS=(
            ["AWS Access Key"]='AKIA[0-9A-Z]{16}'
            ["AWS Secret Key"]='(?i)aws.{0,20}secret.{0,20}['\''"][0-9a-zA-Z/+=]{40}'
            ["Generic API Key"]='(?i)(api_key|apikey|api-key)\s*[:=]\s*['\''"]?[A-Za-z0-9_\-]{20,}'
            ["Private Key Header"]='-----BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY-----'
            ["Generic Password"]='(?i)(password|passwd|pwd)\s*[:=]\s*['\''"][^'\''"\s]{8,}'
            ["Bearer Token"]='Bearer\s+[A-Za-z0-9\-._~+/]+=*'
          )

          for name in "${!PATTERNS[@]}"; do
            MATCHES=$(git grep -rPn "${PATTERNS[$name]}" \
              -- ':!*.yml' ':!*.yaml' ':!*.lock' ':!node_modules' ':!.git' ':!*.env.example' ':!**/.env.example' \
              2>/dev/null \
              | grep -vE "$PLACEHOLDER_PATTERN" \
              || true)
            if [ -n "$MATCHES" ]; then
              echo "::warning::Possible $name found:"
              echo "$MATCHES"
              FAIL=1
            fi
          done

          if [ $FAIL -eq 1 ]; then
            echo "::error::Potential hardcoded secrets detected. Review the warnings above."
            exit 1
          fi

          echo "No hardcoded credential patterns found."
